name: Windows checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: windows-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUN_VERSION: '1.4.2'

jobs:
  desktop:
    name: Windows desktop acceptance
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Localization parity
        run: bun run i18n:check

      - name: Unit and integration tests
        run: bun run test:unit

      - name: Build desktop app
        run: bun run build

      - name: Research project and Agent E2E
        run: bun run test:e2e

      - name: Build Windows installer
        run: bun run release:package

      - name: Packaged app smoke test
        run: bun run test:package-smoke

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-enterprise-research-verification
          path: |
            docs/demos/business-research/fixture-verification.json
            docs/demos/business-research/monitor-fixture-verification.json
            dist/release/*.exe
            dist/release/SHA256SUMS.txt
          if-no-files-found: warn

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Scan high-signal secret patterns
        shell: bash
        run: |
          set -uo pipefail
          MATCHED_FILES=$(grep -rIlE \
            --exclude-dir=node_modules \
            --exclude-dir=docs \
            --exclude='*.test.ts' --exclude='*.test.tsx' --exclude='bun.lock' \
            'ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            . || true)
          if [ -n "$MATCHED_FILES" ]; then
            echo '::error::Possible secret patterns found in the following files:'
            printf '%s\n' "$MATCHED_FILES"
            exit 1
          fi
          echo 'No high-signal secret patterns found.'
