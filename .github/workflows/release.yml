name: Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit and integration tests
        run: bun run test:unit

      - name: Typecheck
        run: bun run typecheck

      - name: Localization parity
        run: bun run i18n:check

      - name: Build
        run: bun run build

      - name: Enterprise research Electron E2E
        run: bun run test:e2e

      - name: Package Windows installer and checksums
        run: bun run release:package
        env:
          FINAGENT_BUILD_SHA: ${{ github.sha }}
          FINAGENT_CHANNEL: alpha

      - name: Packaged Windows smoke test
        run: bun run test:package-smoke

      - name: Clean NSIS installer install/uninstall smoke
        run: bun run test:installer-smoke

      - name: Verify installer checksums
        shell: pwsh
        run: |
          $releasePath = Resolve-Path 'dist/release'
          $manifest = Join-Path $releasePath 'SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $manifest)) { throw 'SHA256SUMS.txt was not created.' }
          foreach ($line in Get-Content -LiteralPath $manifest) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') { throw "Invalid checksum row: $line" }
            $expected = $Matches[1]
            $name = $Matches[2]
            $file = Join-Path $releasePath $name
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Missing installer: $name" }
            $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Checksum mismatch for $name" }
          }

      - name: Write release notes
        shell: pwsh
        run: |
          @'
          # Enterprise Research Workbench ${{ github.ref_name }}

          Windows installer build. This installer is unsigned; verify `SHA256SUMS.txt` before installation.
          '@ | Set-Content -LiteralPath 'release-notes.md' -Encoding utf8

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/*.exe
            dist/release/SHA256SUMS.txt
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
